name: Documentation Issue
description: Report missing, outdated or unclear documentation for kora-qa-panel.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in kora-qa-panel
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Issue workflow, Scenario scan and validation, Game API and
      bughook, Authentication and deployment.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
