# Add inside the existing `server { ... }` block for zap.ssite.co.uk (443, Certbot) in
# /etc/nginx/sites-enabled/zap.ssite.co.uk, then `nginx -t && systemctl reload nginx`.

# The game API is loopback-only (kora_qa calls 127.0.0.1:47620 directly); never proxy it.
location /qa/game/ {
    return 404;
}

location = /qa {
    return 301 /qa/;
}

location /qa/ {
    proxy_pass http://127.0.0.1:47620;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The panel refuses /qa/game and /qa/auth/dev-login when these are present (belt and braces).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
    proxy_read_timeout 300s;   # apply/revert through apply-fix.sh can take a while
}
